<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Codex Account Manager for VS Code</title>
<desc id="desc">Illustrated account picker with Personal and Work profiles, automatic window reload, and remembered selection.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1420"/><stop offset="1" stop-color="#142b32"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#4ce0b2" stop-opacity=".13"/><stop offset="1" stop-color="#4ce0b2" stop-opacity="0"/></radialGradient>
<linearGradient id="card" x2="0" y2="1"><stop stop-color="#1d2936"/><stop offset="1" stop-color="#151e29"/></linearGradient>
</defs>
<rect width="1280" height="640" rx="24" fill="url(#bg)"/>
<circle cx="1080" cy="390" r="410" fill="url(#glow)"/>
<path d="M640 0v640M0 520h1280" stroke="#a6b7c6" stroke-opacity=".06"/>
<g font-family="Segoe UI,Arial,sans-serif">
<g transform="translate(64 62)">
