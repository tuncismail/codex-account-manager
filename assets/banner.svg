<text x="74" y="32" fill="#e6eef3" font-size="19" font-weight="600">Personal</text>
<text x="74" y="55" fill="#8fa9b8" font-size="13">active in this window</text>
<path d="m449 38 6 6 12-13" stroke="#6fe6bf" stroke-width="2" fill="none" stroke-linecap="round"/>
</g>
<g transform="translate(20 201)">
