<text x="60" y="256" fill="#f1f7f9" font-size="62" font-weight="700" letter-spacing="-2">Your accounts.</text>
<text x="60" y="326" fill="#55e2b6" font-size="62" font-weight="700" letter-spacing="-2">One workspace.</text>
<text x="64" y="382" fill="#b2c1ce" font-size="21">Switch Codex profiles. Keep your flow.</text>
<text x="64" y="415" fill="#b2c1ce" font-size="21">Named accounts. Automatic window reload.</text>
<g transform="translate(64 458)" font-size="14" fill="#d0dde6">
<rect width="126" height="33" rx="8" fill="#1c303c" stroke="#30434e"/><text x="19" y="22">Windows x64</text>
