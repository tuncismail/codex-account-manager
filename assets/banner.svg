<rect width="533" height="355" rx="18" fill="url(#card)" stroke="#3b4c5c"/>
<circle cx="24" cy="25" r="4" fill="#668093"/><circle cx="40" cy="25" r="4" fill="#668093"/><circle cx="56" cy="25" r="4" fill="#668093"/>
<text x="266" y="31" text-anchor="middle" font-size="15" fill="#becbd5">Switch Codex account</text>
